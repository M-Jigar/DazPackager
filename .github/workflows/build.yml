name: Build DazPackager

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build self-contained exe
        run: >
          dotnet publish src -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      - name: Save the exe
        uses: actions/upload-artifact@v4
        with:
          name: DazPackager-win-x64
          path: publish/win-x64/DazPackager.exe
