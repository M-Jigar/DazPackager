name: Build DazPackager

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build self-contained exe
        run: >
          dotnet publish src -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      - name: Rename the exe
        run: Rename-Item publish/win-x64/DazPackager.exe DazPackager-win-x64-self-contained.exe

      - name: Save the exe
        uses: actions/upload-artifact@v4
        with:
          name: DazPackager-win-x64-self-contained
          path: publish/win-x64/DazPackager-win-x64-self-contained.exe

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" publish/win-x64/DazPackager-win-x64-self-contained.exe --title "DazPackager Self-contained Build" --notes "Windows x64 build with Self-contained dotnet (no .NET install required in windows)"
